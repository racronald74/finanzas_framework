<!DOCTYPE html>
<html lang="es">

<head th:replace="fragments/head :: head"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="dashboard-container">

    <h2>Bienvenido</h2>

    <p>

        Panel principal del sistema.

    </p>

    <div class="cards">
        <div class="card">
            <h3>

    <span
        th:if="${totalGastos != null}"
        th:text="|$${totalGastos}|">
    </span>

    <span
        th:unless="${totalGastos != null}">

        $0

    </span>

</h3>
            <p>Gastos del mes</p>
        </div>

<div class="card">
<h3>

        <span
            th:if="${totalIngresos != null}"
            th:text="|$${totalIngresos}|">
        </span>

        <span
        th:unless="${totalIngresos != null}">

        $0

        </span>

</h3>
            <p>Ingresos el mes</p>
</div>

        <div class="card">
            <h2 class="text-success">

    <span
        th:if="${saldoDisponible != null}"
        th:text="|$${saldoDisponible}|">
    </span>

    <span
        th:unless="${saldoDisponible != null}">

        $0

    </span>

</h2>
            <p>Saldo disponible</p>
    </div>
    </div>

    <h3>Accesos rápidos</h3>

    <div class="acciones">

    <a class="boton"
    th:href="@{/gastos}">

        Gestionar gastos

    </a>

</div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
