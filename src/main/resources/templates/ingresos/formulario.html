<!DOCTYPE html>
<html lang="es"
    xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <h2 class="mb-4">

        Registrar ingreso adicional

    </h2>

    <form
            th:action="@{/ingresos}"
            th:object="${ingreso}"
            method="post">

        <input
                type="hidden"
                th:field="*{id}">

                <input
        type="hidden"
        th:field="*{tipo}">

        <div class="mb-3">

            <label class="form-label">

                Monto

            </label>

            <input
                    class="form-control"
                    type="number"
                    step="0.01"
                    th:field="*{monto}">

        </div>

        <div class="mb-3">

            <label class="form-label">

                Fecha

            </label>

            <input
                    class="form-control"
                    type="date"
                    th:field="*{fecha}">

        </div>

        <div class="mb-4">

            <label class="form-label">

                Descripción

            </label>

            <textarea
                    class="form-control"
                    rows="4"
                    th:field="*{descripcion}">
            </textarea>

        </div>

        <button
                class="btn btn-primary"
                type="submit">

            Guardar

        </button>

        <a
                class="btn btn-secondary"
                th:href="@{/ingresos}">

            Cancelar

        </a>

    </form>

</div>

<div th:replace="fragments/footer :: footer"></div>

<div th:replace="fragments/scripts :: scripts"></div>

</body>

</html>
