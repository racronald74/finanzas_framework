<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">

    <div class="alert alert-info" role="alert">
        Demostración académica: estas operaciones usan JDBC explícito sobre la tabla aislada
        <code>gasto_jdbc_demo</code>. No modifican los gastos gestionados con JPA/Hibernate.
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gastos JDBC</h2>
        <a class="btn btn-primary" th:href="@{/demostracion-jdbc/gastos/nuevo}">
            Nuevo gasto JDBC
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" role="alert" th:text="${mensajeExito}"></div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Monto</th>
            <th>Origen</th>
            <th>Descripción</th>
            <th>Usuario</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(gastos)}">
            <td colspan="7" class="text-center">No existen gastos de demostración registrados.</td>
        </tr>
        <tr th:each="gasto : ${gastos}">
            <td th:text="${gasto.id}"></td>
            <td th:text="${gasto.fecha}"></td>
            <td th:text="${gasto.monto}"></td>
            <td th:text="${gasto.origen.descripcion}"></td>
            <td th:text="${gasto.descripcion}"></td>
            <td th:text="${gasto.usuarioNombre}"></td>
            <td class="d-flex gap-2">
                <a class="btn btn-sm btn-warning"
                   th:href="@{/demostracion-jdbc/gastos/editar/{id}(id=${gasto.id})}">
                    Editar
                </a>
                <form th:action="@{/demostracion-jdbc/gastos/eliminar/{id}(id=${gasto.id})}"
                      method="post"
                      onsubmit="return confirm('¿Eliminar este gasto de demostración?');">
                    <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
