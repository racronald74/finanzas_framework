<!DOCTYPE html>
<html lang="es"
xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <h2 class="mb-4"
    th:text="${gasto.id == null}
        ? 'Registrar gasto'
        : 'Editar gasto'">
</h2>

    <form
            th:action="@{/gastos}"
            th:object="${gasto}"
            method="post">

            <input
        type="hidden"
        th:field="*{id}">

        <div class="mb-3">

            <label class="form-label">

                Monto

            </label>

            <input
        class="form-control"
        th:classappend="${#fields.hasErrors('monto')} ? ' is-invalid' : ''"
        type="number"
        step="0.01"
        th:field="*{monto}">

        <div
        class="invalid-feedback"
        th:if="${#fields.hasErrors('monto')}"
        th:errors="*{monto}">
            </div>
        </div>

        <div class="mb-3">

            <label class="form-label">

                Fecha

            </label>

            <input
        type="date"
        class="form-control"
        name="fecha"
        id="fecha"
        th:value="${gasto.fecha}"
        th:classappend="${#fields.hasErrors('fecha')} ? ' is-invalid' : ''">

        <div
        class="invalid-feedback"
        th:if="${#fields.hasErrors('fecha')}"
        th:errors="*{fecha}">
</div>
        </div>

        <div class="mb-3">

            <label class="form-label">

                Origen

            </label>

            <select
        class="form-select"
        th:classappend="${#fields.hasErrors('origen')} ? ' is-invalid' : ''"
        th:field="*{origen}">

    <option value="">Seleccione</option>

    <option
        th:each="origen : ${origenes}"
        th:value="${origen}"
        th:text="${origen.descripcion}">
        </option>

</select>

<div
        class="invalid-feedback"
        th:if="${#fields.hasErrors('origen')}"
        th:errors="*{origen}">
</div>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Descripción

            </label>

            <textarea
        class="form-control"
        th:classappend="${#fields.hasErrors('descripcion')} ? ' is-invalid' : ''"
        rows="4"
        th:field="*{descripcion}">
</textarea>

<div
        class="invalid-feedback"
        th:if="${#fields.hasErrors('descripcion')}"
        th:errors="*{descripcion}">
</div>

        </div>

        <button
        class="btn btn-primary"
        type="submit"
        th:text="${gasto.id == null}
            ? 'Guardar'
            : 'Actualizar'">
</button>

        <a
                class="btn btn-secondary"
                th:href="@{/gastos}">

            Cancelar

        </a>

    </form>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>

</html>
